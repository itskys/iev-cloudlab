# IEV CloudLab — JupyterHub 单机部署（Docker Compose + DockerSpawner）
# 宿主机：CentOS Stream 10，SELinux enforcing
# 落点：设计文档 §5 Step 3（6 条防坑铁律）
services:
  jupyterhub:
    image: jupyterhub/jupyterhub:5.5.3
    container_name: jupyterhub
    restart: unless-stopped
    # 铁律1：官方裸镜像不含插件，启动时补装
    # 用 exec 数组形式（argv 精确传递），避免字符串 command 被按空白切分
    # （2026-10-17 实测：字符串 + YAML 折叠写法会导致 bash 收到多行脚本而启动失败）
    command: ["bash", "-c", "pip install --no-cache-dir dockerspawner jupyterhub-idle-culler==2.0.0 jupyterhub-nativeauthenticator && exec jupyterhub --config /srv/jupyterhub/jupyterhub_config.py"]
    ports:
      - "127.0.0.1:8000:8000"  # 仅本机；对外走 Cloudflare Tunnel
    volumes:
      # 铁律2：docker.sock 绝不加 :z，用 label=disable
      - /var/run/docker.sock:/var/run/docker.sock
      # 铁律2b：持久化 Hub 的 SQLite 状态库
      - /opt/ievlab/hub_data:/srv/jupyterhub:z
      # 配置文件
      - ./jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:z,ro
      # 自研邮箱验证码认证器 + 自定义登录模板
      - ./otp_authenticator.py:/srv/jupyterhub/otp_authenticator.py:z,ro
      - ./templates:/srv/jupyterhub/templates:z,ro
      # 品牌资产（Logo/Favicon/OG）：Gemini 第十一章规范
      - ../assets:/srv/jupyterhub/assets:z,ro
      # 铁律5：pre_spawn_hook 需要操作宿主机用户目录，挂进来
      - /opt/ievlab/home:/opt/ievlab/home:z
      # [内容分发与同步 - 2026-10-25 给 Muse 说明]：
      # 挂载标准实验课件只读源库与分发脚本，供 pre_spawn_hook 自动为新注册学生播种实验文件
      - /opt/ievlab/scenarios:/opt/ievlab/scenarios:z,ro
      - ./distribute.py:/srv/jupyterhub/distribute.py:z,ro
    security_opt:
      - label=disable
    networks:
      - ievlab_net

networks:
  # 显式命名：必须与 jupyterhub_config.py 里 c.DockerSpawner.network_name="ievlab_net" 一致，
  # 否则学生容器会被挂到 deploy_ievlab_net 而 Hub 去连 ievlab_net（铁律4）
  ievlab_net:
    name: ievlab_net
    driver: bridge
