{% extends "page.html" %}
{% block main %}
  <style>
    .iev-sp-wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; text-align: center; }
    .iev-sp-card {
      background: #fff; border-radius: 18px;
      box-shadow: 0 12px 40px rgba(26, 115, 232, 0.10), 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 44px 36px;
    }
    .iev-sp-card .progress { height: 10px; border-radius: 6px; margin: 20px 0; }
    .iev-spinner {
      width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%;
      border: 4px solid #e8f0fe; border-top-color: #1a73e8;
      animation: iev-spin 1s linear infinite;
    }
    @keyframes iev-spin { to { transform: rotate(360deg); } }
    .iev-sp-card p { color: #6b778c; font-size: 14px; }
  </style>
  <div class="iev-sp-wrap"><div class="iev-sp-card">
    <div class="iev-spinner"></div>
    {% block message %}
      <p data-i18n="sp_starting">正在启动实验环境…</p>
      <p data-i18n="sp_redirect">就绪后会自动跳转，请稍候。</p>
    {% endblock message %}
    <div class="progress">
      <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <span class="visually-hidden"><span id="sr-progress">0%</span> Complete</span>
      </div>
    </div>
    <p id="progress-message"></p>
    <details id="progress-details" style="text-align: left; margin-top: 16px;">
      <summary data-i18n="sp_log">事件日志</summary>
      <div id="progress-log"></div>
    </details>
  </div></div>
{% endblock main %}
{% block script %}
  {{ super() }}
  <script type="text/javascript">
    require(["jquery"], function($) {
      $("#refresh").click(function() { window.location.reload(); });
    });
  </script>
  <script type="text/javascript">
    // 轮询 Hub API，spawn 完成后自动跳转（替代缺失的 spawn_pending.js 模块）
    (function() {
      var baseUrl = document.querySelector('base') ? document.querySelector('base').href : '/hub/';
      // 从 URL 提取用户名：/hub/spawn-pending/<username>
      var m = window.location.pathname.match(/spawn-pending\/([^\/]+)/);
      var username = m ? m[1] : '';
      if (!username) { setTimeout(function(){ location.reload(); }, 5000); return; }
      var apiUrl = baseUrl + 'api/users/' + encodeURIComponent(username);
      function poll() {
        fetch(apiUrl, {credentials: 'same-origin'})
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.server || (data.servers && Object.keys(data.servers).length > 0)) {
              window.location.href = baseUrl + 'user/' + encodeURIComponent(username) + '/lab';
            } else {
              setTimeout(poll, 2000);
            }
          })
          .catch(function() { setTimeout(poll, 3000); });
      }
      setTimeout(poll, 1500);
    })();
  </script>
{% endblock script %}
