{% extends "page.html" %}
{% block main %}
  <style>
    .iev-sp-wrap {
      max-width: 580px;
      margin: 0 auto;
      padding: 48px 20px;
      text-align: center;
    }
    .iev-sp-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 20px 50px -15px rgba(15, 23, 42, 0.09), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      padding: 44px 36px 36px;
      position: relative;
    }
    .iev-sp-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #155eef, #00d4ff, #10b981);
      border-radius: 22px 22px 0 0;
    }
    .iev-spinner-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
    }
    .iev-spinner {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #eff6ff;
      border-top-color: #155eef;
      border-right-color: #00d4ff;
      animation: iev-spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    .iev-spinner-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
    }
    @keyframes iev-spin {
      to { transform: rotate(360deg); }
    }
    .iev-sp-title {
      font-size: 21px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }
    .iev-sp-card p.sub {
      color: #64748b;
      font-size: 14px;
      margin: 0 0 22px;
      line-height: 1.5;
    }
    .iev-sp-card .progress {
      height: 10px;
      border-radius: 20px;
      background: #f1f5f9;
      margin: 22px 0 14px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .iev-sp-card .progress-bar {
      background: linear-gradient(90deg, #155eef 0%, #00d4ff 100%);
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    /* 阶段引导 */
    .iev-sp-stages {
      display: flex;
      justify-content: space-between;
      margin: 24px 0 10px;
      padding: 14px 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
      text-align: left;
      font-size: 11.5px;
      color: #64748b;
    }
    .iev-sp-stage-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .iev-sp-stage-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    #progress-details {
      text-align: left;
      margin-top: 18px;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      font-size: 12.5px;
      color: #475569;
    }
    #progress-details summary {
      cursor: pointer;
      font-weight: 600;
      color: #334155;
      outline: none;
    }
    #progress-log {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #64748b;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

  <div class="iev-sp-wrap">
    <div class="iev-sp-card">
      <div class="iev-spinner-wrap">
        <div class="iev-spinner"></div>
        <div class="iev-spinner-inner">⚡</div>
      </div>
      {% block message %}
        <h3 class="iev-sp-title" data-i18n="sp_starting">正在启动实验环境…</h3>
        <p class="sub" data-i18n="sp_redirect">系统正在分配容器算力并加载镜像，就绪后会自动跳转，请稍候。</p>
      {% endblock message %}

      <div class="progress">
        <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <span class="visually-hidden"><span id="sr-progress">0%</span> Complete</span>
        </div>
      </div>
      <p id="progress-message" style="font-size: 13px; color: #64748b; font-weight: 500; margin: 0; min-height: 20px;"></p>

      <div class="iev-sp-stages">
        <div class="iev-sp-stage-item"><span class="iev-sp-stage-dot"></span><span>1. 配额核验</span></div>
        <div class="iev-sp-stage-item"><span class="iev-sp-stage-dot"></span><span>2. CPU 容器拉起</span></div>
        <div class="iev-sp-stage-item"><span class="iev-sp-stage-dot"></span><span>3. 持久化挂载</span></div>
        <div class="iev-sp-stage-item"><span class="iev-sp-stage-dot"></span><span>4. JupyterLab 就绪</span></div>
      </div>

      <details id="progress-details">
        <summary data-i18n="sp_log">事件日志 (Event Logs)</summary>
        <div id="progress-log"></div>
      </details>
    </div>
  </div>
{% endblock main %}
{% block script %}
  {{ super() }}
  <script type="text/javascript">
    require(["jquery"], function($) {
      $("#refresh").click(function() { window.location.reload(); });
    });
  </script>
  <script type="text/javascript">
    // 轮询 Hub API，spawn 完成后自动跳转（替代缺失的 spawn_pending.js 模块）
    (function() {
      var baseUrl = document.querySelector('base') ? document.querySelector('base').href : '/hub/';
      // 从 URL 提取用户名：/hub/spawn-pending/<username>
      var m = window.location.pathname.match(/spawn-pending\/([^\/]+)/);
      var username = m ? m[1] : '';
      if (!username) { setTimeout(function(){ location.reload(); }, 5000); return; }
      var apiUrl = baseUrl + 'api/users/' + encodeURIComponent(username);
      function getCookie(name) {
        var m = document.cookie.match(new RegExp('(^|;\s*)' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[2]) : '';
      }
      function poll() {
        fetch(apiUrl, {
          credentials: 'same-origin',
          headers: {'X-XSRFToken': getCookie('_xsrf')}
        })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.server || (data.servers && Object.keys(data.servers).length > 0)) {
              window.location.href = baseUrl + 'user/' + encodeURIComponent(username) + '/lab';
            } else {
              setTimeout(poll, 2000);
            }
          })
          .catch(function() { setTimeout(poll, 3000); });
      }
      setTimeout(poll, 1500);
    })();
  </script>
{% endblock script %}
