{% extends "page.html" %}
{% block main %}
  <style>
    .iev-nr-wrap {
      max-width: 580px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .iev-nr-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 20px 50px -15px rgba(15, 23, 42, 0.09), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      padding: 44px 36px;
      text-align: center;
    }
    .iev-nr-icon {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .iev-nr-icon.failed {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      color: #dc2626;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.2);
    }
    .iev-nr-icon.idle {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      color: #1d4ed8;
      box-shadow: 0 8px 24px rgba(21, 94, 239, 0.18);
    }
    .iev-nr-icon svg { width: 38px; height: 38px; }
    .iev-nr-card h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.01em;
      margin: 0 0 10px;
    }
    .iev-nr-card p {
      font-size: 14.5px;
      color: #64748b;
      margin: 0 0 26px;
      line-height: 1.6;
    }
    .iev-nr-card .alert {
      text-align: left;
      font-size: 13px;
      border-radius: 12px;
      margin-top: 12px;
    }
    .iev-btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 40px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #155eef 0%, #003eb3 100%);
      color: #ffffff !important;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none !important;
      box-shadow: 0 6px 20px rgba(21, 94, 239, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .iev-btn-primary:hover {
      box-shadow: 0 10px 28px rgba(21, 94, 239, 0.45);
      transform: translateY(-2px);
    }
  </style>
  <div class="iev-nr-wrap">
    <div class="iev-nr-card">
      {% if failed %}
        <div class="iev-nr-icon failed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <h1 data-i18n="nr_failed_title">启动失败</h1>
        <p>
          <span data-i18n="nr_failed_msg">最近一次启动实验环境的尝试失败了，要重试吗？</span>
          {% if failed_message %}</p><p class="alert alert-danger">{{ failed_message }}</p><p>{% endif %}
        </p>
        <a id="start" role="button" class="iev-btn-primary" href="{{ spawn_url }}" data-i18n="nr_relaunch">重新启动</a>
      {% else %}
        <div class="iev-nr-icon idle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <h1 data-i18n="nr_idle_title">实验环境未运行</h1>
        <p data-i18n="nr_idle_msg">你的实验环境还没启动，要现在启动吗？</p>
        <a id="start" role="button" class="iev-btn-primary" href="{{ spawn_url }}" data-i18n="nr_launch">启动实验环境</a>
      {% endif %}
    </div>
  </div>
{% endblock main %}
{% block script %}
  {{ super() }}
  <script type="text/javascript">
    require(["not_running"]);
  </script>
{% endblock script %}
