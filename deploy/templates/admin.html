{% extends "page.html" %}
{% block main %}
  <div class="iev-page-container">
    <div class="iev-page-header">
      <div class="iev-badge-chip">
        <span class="iev-status-dot"></span>
        <span data-i18n="admin_chip">系统控制台 · 集群运维</span>
      </div>
      <h1 class="iev-page-title" data-i18n="admin_title">用户与运行实例管理</h1>
      <p class="iev-page-sub" data-i18n="admin_sub">实时监控平台教学科研账户、DockerSpawner 容器沙箱运行状态及资源配置调度</p>

      <!-- 节点算力与运维指标卡片 -->
      <div class="row g-3 mt-2 mb-4">
        <div class="col-md-4">
          <div class="iev-card p-3 mb-0" style="background: var(--iev-card-bg);">
            <div class="d-flex align-items-center gap-3">
              <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(21, 94, 239, 0.1); border: 1px solid rgba(21, 94, 239, 0.2); display: flex; align-items: center; justify-content: center; font-size: 20px;">
                👥
              </div>
              <div>
                <div style="font-size: 12px; color: var(--iev-text-muted); font-weight: 600;">平台授权用户</div>
                <div style="font-size: 18px; font-weight: 800; color: var(--iev-text-primary);">高校师生账户</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="iev-card p-3 mb-0" style="background: var(--iev-card-bg);">
            <div class="d-flex align-items-center gap-3">
              <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); display: flex; align-items: center; justify-content: center; font-size: 20px;">
                🚀
              </div>
              <div>
                <div style="font-size: 12px; color: var(--iev-text-muted); font-weight: 600;">容器调度架构</div>
                <div style="font-size: 18px; font-weight: 800; color: var(--iev-text-primary);">DockerSpawner 沙箱</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="iev-card p-3 mb-0" style="background: var(--iev-card-bg);">
            <div class="d-flex align-items-center gap-3">
              <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(2, 132, 199, 0.1); border: 1px solid rgba(2, 132, 199, 0.2); display: flex; align-items: center; justify-content: center; font-size: 20px;">
                ⚡
              </div>
              <div>
                <div style="font-size: 12px; color: var(--iev-text-muted); font-weight: 600;">单实例配额</div>
                <div style="font-size: 18px; font-weight: 800; color: var(--iev-text-primary);">1.0 vCPU · 2GB · 512MB shm</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 管理控制台主卡片 -->
    <div class="iev-card p-4">
      <div id="react-admin-hook">
        <script id="jupyterhub-admin-config">
          window.api_page_limit = parseInt("{{ api_page_limit|safe }}")
          window.base_url = "{{ base_url|safe }}"
        </script>
        <script src={{ static_url("js/admin-react.js") }}></script>
      </div>
    </div>
  </div>
{% endblock main %}
{% block footer %}
  {{ super() }}
{% endblock footer %}
